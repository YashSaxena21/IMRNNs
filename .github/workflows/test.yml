name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts examples
      - run: pytest --cov=imrnns --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python -m venv /tmp/imrnns-smoke
      - run: /tmp/imrnns-smoke/bin/pip install dist/*.whl
      - run: /tmp/imrnns-smoke/bin/python -c "from imrnns import IMRNNAdapter; print(IMRNNAdapter.__name__)"
      - run: /tmp/imrnns-smoke/bin/imrnns info
