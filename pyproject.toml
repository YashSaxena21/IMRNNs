[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imrnns"
version = "0.2.0"
description = "Interpretable dense-retrieval adapters via embedding modulation"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
license-files = ["LICENSE", "ATTRIBUTION.md"]
authors = [
  {name = "Yash Saxena"},
  {name = "Ankur Padia"},
  {name = "Kalpa Gunaratna"},
  {name = "Manas Gaur"},
]
keywords = ["dense retrieval", "information retrieval", "interpretability", "RAG"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "huggingface-hub>=0.31",
  "numpy>=1.24",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["beir>=2.0"]
eval = [
  "beir>=2.0",
  "faiss-cpu>=1.8; platform_machine != 'arm64'",
]
viz = ["matplotlib>=3.8"]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://yashsaxena21.github.io/IMRNNs-web/"
Documentation = "https://github.com/YashSaxena21/IMRNNs#readme"
Repository = "https://github.com/YashSaxena21/IMRNNs"
Paper = "https://aclanthology.org/2026.findings-eacl.333/"
"Model checkpoints" = "https://huggingface.co/yashsaxena21/IMRNNs"

[project.scripts]
imrnns = "imrnns.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
